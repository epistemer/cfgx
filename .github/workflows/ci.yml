name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Go ${{ matrix.go }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.x'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Run tests with race detector
        run: go test -race ./...

      # The Secret leak suite runs in the step above too; this step names it,
      # so a failure is plain in the job's summary.
      - name: Secret leak suite
        run: |
          go test -count=1 -v -run 'TestLeak|TestSecret' . | tee leak.log
          # A filter that matched nothing would pass; make sure it ran.
          grep -q -- '--- PASS: TestLeak_' leak.log

      - name: Fuzz (30s per target)
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.x'
        run: |
          set -e
          for target in engine:FuzzParseByteSize engine:FuzzParseDuration engine:FuzzSplitCSV \
              engine:FuzzParseStringMap engine:FuzzFormatStrings engine:FuzzFormatStringMap internal/node:FuzzParse; do
            pkg=${target%%:*}
            name=${target#*:}
            echo "fuzzing $name in ./$pkg"
            go test -run '^$' -fuzz "^${name}\$" -fuzztime 30s "./$pkg"
          done

      # The viper comparison (examples/zp/bench, M9.1) is a module of its
      # own. Run each benchmark once, except the cold generate one, which
      # takes 20s, so they keep building and passing; and check that the
      # generated code is current.
      - name: Benchmarks build and pass
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.27.x'
        working-directory: examples/zp/bench
        run: |
          go vet ./...
          (cd keys100 && go tool cfgx gen -check -artifacts - ./schema)
          go test -run '^$' -bench 'ZpServe|Keys100|Generate/warm' -benchtime 1x .
