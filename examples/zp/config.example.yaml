# zp: ZaynPay backend.
# Generated by cfgx from the schema; don't edit. Every setting is commented
# out at its default: uncomment a line to change it.

# Logging
log:
  # Minimum log level; one of debug, info, warn, error.
  # Env ZP_LOG_LEVEL, flag --log-level. Used by every command.
  # level: "info"

  # Output format; one of text, json.
  # Env ZP_LOG_FORMAT, flag --log-format. Used by every command.
  # format: "text"

  # Force colored output even without a TTY.
  # Env ZP_LOG_COLOR, flag --log-color. Used by every command.
  # color:

# Database connection
database:
  # Database server host.
  # Env ZP_DATABASE_HOST, flag --database-host. Used by Serve, Migrate.
  # host: "localhost"

  # Database server port.
  # Env ZP_DATABASE_PORT, flag --database-port. Used by Serve, Migrate.
  # port: 5432

  # Database name.
  # Required.
  # Env ZP_DATABASE_NAME, flag --database-name. Used by Serve, Migrate.
  # name:

  # Database user.
  # Env ZP_DATABASE_USER, flag --database-user. Used by Serve, Migrate.
  # user: "postgres"

  # Database password.
  # Required. Secret: set it in the environment, not here.
  # Env ZP_DATABASE_PASSWORD or ZP_DATABASE_PASSWORD_FILE. Used by Serve, Migrate.
  # password:

  # SSL mode; one of disable, require, verify-full.
  # Env ZP_DATABASE_SSLMODE, flag --database-sslmode. Used by Serve, Migrate.
  # sslmode: "disable"

# Outgoing mail
smtp:
  # SMTP server host.
  # Required.
  # Env ZP_SMTP_HOST, flag --smtp-host. Used by Serve, TestEmail.
  # host:

  # SMTP server port.
  # Env ZP_SMTP_PORT, flag --smtp-port. Used by Serve, TestEmail.
  # port: 587

  # SMTP user.
  # Env ZP_SMTP_USER, flag --smtp-user. Used by Serve, TestEmail.
  # user:

  # SMTP password.
  # Secret: set it in the environment, not here.
  # Env ZP_SMTP_PASSWORD or ZP_SMTP_PASSWORD_FILE. Used by Serve, TestEmail.
  # password:

  # SMTP auth mechanism; one of PLAIN, LOGIN, CRAM-MD5.
  # Env ZP_SMTP_AUTH, flag --smtp-auth. Used by Serve, TestEmail.
  # auth: "PLAIN"

  # Use implicit TLS.
  # Env ZP_SMTP_TLS, flag --smtp-tls. Used by Serve, TestEmail.
  # tls:

# Authentication
auth:
  # Sender address for auth emails.
  # Env ZP_AUTH_EMAILFROM, flag --auth-emailfrom. Used by Serve, TestEmail.
  # emailfrom:

  otp:
    # OTP validity.
    # Env ZP_AUTH_OTP_TTL, flag --auth-otp-ttl. Used by Serve.
    # ttl: "5m0s"

    # OTP length.
    # Env ZP_AUTH_OTP_LENGTH, flag --auth-otp-length. Used by Serve.
    # length: 6

  session:
    # Session lifetime.
    # Env ZP_AUTH_SESSION_TTL, flag --auth-session-ttl. Used by Serve.
    # ttl: "24h0m0s"

  jwt:
    # JWT private key (PEM).
    # Env ZP_AUTH_JWT_PRIVATE, flag --auth-jwt-private. Used by Serve.
    # private: "keys/priv.pem"

    # JWT public key (PEM).
    # Env ZP_AUTH_JWT_PUBLIC, flag --auth-jwt-public. Used by Serve.
    # public: "keys/pub.pem"
  # Static API token.
  # Secret: set it in the environment, not here.
  # Env ZP_AUTH_TOKEN or ZP_AUTH_TOKEN_FILE. Used by Serve.
  # token:

  # CSV file of API keys.
  # Env ZP_AUTH_KEYS, flag --auth-keys. Used by Serve.
  # keys:

  # Require multi-factor authentication.
  # Env ZP_AUTH_MFA, flag --auth-mfa. Used by Serve.
  # mfa:

# HTTP server
server:
  # Listen address.
  # Env ZP_SERVER_HOST, flag --host. Used by Serve.
  # host: "0.0.0.0"

  # Listen port.
  # Env ZP_SERVER_PORT, flag --port. Used by Serve.
  # port: 7777

  tls:
    # Serve HTTPS.
    # Env ZP_SERVER_TLS_ENABLED, flag --tls-enabled. Used by Serve.
    # enabled:

    # TLS certificate.
    # Env ZP_SERVER_TLS_CERT, flag --tls-cert. Used by Serve.
    # cert: "ssl/cert.pem"

    # TLS private key.
    # Env ZP_SERVER_TLS_KEY, flag --tls-key. Used by Serve.
    # key: "ssl/key.pem"

  timeout:
    # Read timeout.
    # Env ZP_SERVER_TIMEOUT_READ, flag --timeout-read. Used by Serve.
    # read: "20s"

    # Write timeout.
    # Env ZP_SERVER_TIMEOUT_WRITE, flag --timeout-write. Used by Serve.
    # write: "1m0s"
  # Maximum request header size.
  # Env ZP_SERVER_MAX_HEADER, flag --max-header. Used by Serve.
  # max_header: "1MiB"

  rate:
    # Requests per second per IP.
    # Env ZP_SERVER_RATE_LIMIT, flag --rate-limit. Used by Serve.
    # limit: 100

    # Burst capacity per IP.
    # Env ZP_SERVER_RATE_BURST, flag --rate-burst. Used by Serve.
    # burst: 20

# Task scheduler
scheduler:
  # Scheduler timezone.
  # Env ZP_SCHEDULER_LOCATION, flag --scheduler-location. Used by Serve.
  # location: "Africa/Cairo"

  # Task execution mode; one of sequential, parallel.
  # Env ZP_SCHEDULER_EXECMODE, flag --scheduler-execmode. Used by Serve.
  # execmode: "sequential"

  # Concurrent workers.
  # Default: from runtime.NumCPU.
  # Env ZP_SCHEDULER_WORKERS, flag --scheduler-workers. Used by Serve.
  # workers:

  # Retry policy
  retry:
    # Maximum retries.
    # Env ZP_SCHEDULER_RETRY_MAX, flag --scheduler-retry-max. Used by Serve.
    # max: 3

    # Delay between retries.
    # Env ZP_SCHEDULER_RETRY_DELAY, flag --scheduler-retry-delay. Used by Serve.
    # delay: "1m0s"

# Local storage
storage:
  # Bolt database file; also holds runtime settings.
  # Env ZP_STORAGE_BOLT, flag --storage-bolt. Used by no command.
  # bolt: "bolt.db"
