# mini: Minimal cfgx example.
# Generated by cfgx from the schema; don't edit. Every setting is commented
# out at its default: uncomment a line to change it.

# HTTP server
server:
  # Listen host.
  # Env MINI_SERVER_HOST, flag --server-host. Used by Serve.
  # host: "localhost"

  # Listen port.
  # Env MINI_SERVER_PORT, flag --server-port. Used by Serve.
  # port: 8080

  # Enable TLS.
  # Env MINI_SERVER_TLS, flag --server-tls. Used by Serve.
  # tls:

# Database connection
database:
  # Database connection URL.
  # Env MINI_DATABASE_URL, flag --database-url. Used by Serve, Migrate.
  # url:

  # Query timeout in seconds.
  # Env MINI_DATABASE_TIMEOUT, flag --database-timeout. Used by Serve, Migrate.
  # timeout:

  # Log SQL queries.
  # Env MINI_DATABASE_DEBUG, flag --database-debug. Used by Serve, Migrate.
  # debug: false

# Logging
log:
  # Log more.
  # Env MINI_LOG_VERBOSE, flag --log-verbose. Used by every command.
  # verbose:
